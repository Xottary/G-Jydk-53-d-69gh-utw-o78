<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devil's Planner</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ================= AUTH SCREEN (ЭКРАН ВХОДА) ================= -->
    <div id="auth-screen" class="hidden">
        <div class="auth-box">
            <h1 class="auth-title">DEVIL'S PLANNER</h1>
            <p class="auth-subtitle">RESTRICTED AREA</p>
            
            <div class="auth-inputs">
                <input type="email" id="auth-email" placeholder="Email" autocomplete="off">
                <input type="password" id="auth-password" placeholder="Password">
            </div>
            
            <div id="auth-error" class="auth-error"></div>
            
            <!-- Оставили только кнопку ВОЙТИ -->
            <button id="btn-login" class="btn-submit">ВОЙТИ</button>
        </div>
    </div>

    <div id="app">
        <!-- ================= HEADER ================= -->
        <header id="header">
            <h1 class="title">DEVIL'S PLANNER</h1>
            <div class="bars-container">
                <!-- HP Bar -->
                <div class="bar-group">
                    <div class="bar-label">
                        <span class="bar-name">HP</span>
                        <span class="bar-value" id="hp-value">100%</span>
                    </div>
                    <div class="bar-track" id="hp-bar"></div>
                </div>
                <!-- DT Bar -->
                <div class="bar-group">
                    <div class="bar-label">
                        <span class="bar-name">DT</span>
                        <span class="bar-value" id="dt-value">0%</span>
                        <span id="dt-reward-icon" style="cursor:pointer; margin-left:10px; font-size:1.2rem;" title="Посмотреть/изменить награду">🎁</span>
                    </div>
                    <div class="bar-track dt-track" id="dt-bar"></div>
                </div>
            </div>
        </header>

        <!-- ================= STYLE METER ================= -->
        <div id="style-meter" class="style-meter">
            <div class="style-label">STYLE METER</div>
            <div class="style-rank" id="style-rank">D</div>
            <div class="style-percent" id="style-percent">0%</div>
        </div>

        <!-- ================= CALENDAR ================= -->
        <section class="calendar-section">
            <div class="calendar-nav">
                <button id="prev-week">&lt; ПРЕД.</button>
                <div style="display:flex; gap:10px; align-items:center;">
                    <button id="toggle-view">НЕДЕЛЯ</button>
                    <button id="toggle-archive">АРХИВ</button>
                    <div class="calendar-month" id="current-month">ОКТЯБРЬ 2026</div>
                </div>
                <button id="next-week">СЛЕД. &gt;</button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </section>

        <!-- ================= MAIN CONTENT ================= -->
        <main id="main-content">
            <!-- Форма добавления миссии -->
            <section class="task-form-section">
                <h2 class="section-title">NEW MISSION</h2>
                <form id="task-form">
                    <div class="form-group">
                        <input type="text" id="task-title" placeholder="Mission title..." required maxlength="100">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="task-deadline">Deadline</label>
                            <input type="datetime-local" id="task-deadline" required>
                        </div>
                        <div class="form-group">
                            <label for="task-severity">Severity</label>
                            <select id="task-severity">
                                <option value="1">1 — Minor</option>
                                <option value="2" selected>2 — Major</option>
                                <option value="3">3 — Critical</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">ACCEPT MISSION</button>
                </form>
            </section>

            <!-- Форма добавления пар -->
            <section class="task-form-section" style="border-left: 3px solid #00a8b5;">
                <h2 class="section-title" style="color: #00a8b5;">ADD CLASS / SCHEDULE</h2>
                <form id="class-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="class-date">Date</label>
                            <input type="date" id="class-date" required>
                        </div>
                        <div class="form-group">
                            <label for="class-time-preset">Time Slot</label>
                            <select id="class-time-preset">
                                <option value="08:30-10:00">08:30 – 10:00</option>
                                <option value="10:15-11:45">10:15 – 11:45</option>
                                <option value="12:30-14:00">12:30 – 14:00</option>
                                <option value="14:15-15:45">14:15 – 15:45</option>
                                <option value="16:00-17:30">16:00 – 17:30</option>
                                <option value="18:00-19:30">18:00 – 19:30</option>
                                <option value="19:40-21:10">19:40 – 21:10</option>
                                <option value="08:00-17:30">08:00 – 17:30 (Практика)</option>
                                <option value="custom">Своё время...</option>
                            </select>
                        </div>
                    </div>

                    <!-- Скрытые поля для ввода своего времени -->
                    <div class="form-row" id="custom-time-inputs" style="display: none;">
                        <div class="form-group">
                            <label for="class-start">Start</label>
                            <input type="time" id="class-start">
                        </div>
                        <div class="form-group">
                            <label for="class-end">End</label>
                            <input type="time" id="class-end">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group" style="flex: 2;">
                            <label for="class-title">Title</label>
                            <input type="text" id="class-title" placeholder="Выберите или введите предмет..." list="subject-list" required>
                            <datalist id="subject-list">
                                <option value="ИПК 3"></option>
                                <option value="МОО"></option>
                                <option value="ИИН 1"></option>
                                <option value="ИИН 2"></option>
                                <option value="ВИ 7"></option>
                                <option value="ВИ 8"></option>
                                <option value="РИ 7"></option>
                                <option value="РИ 8"></option>
                                <option value="Производственная практика"></option>
                                <option value="ПДПС"></option>
                                <option value="ЕПвИИ"></option>
                            </datalist>
                        </div>
                        <div class="form-group">
                            <label for="class-type">Type</label>
                            <select id="class-type">
                                <option value="Lecture">Lecture</option>
                                <option value="Practice">Practice</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="class-room">Room</label>
                            <input type="text" id="class-room" placeholder="Room 15">
                        </div>
                    </div>
                    <button type="submit" class="btn-submit" style="background: linear-gradient(135deg, #005060, #00a8b5); border-color: #00a8b5;">ADD CLASS</button>
                </form>
            </section>
        </main>

        <!-- ================= FAILSAFE RESET ================= -->
        <div style="text-align: center; margin-top: 30px;">
            <button id="reset-btn" class="btn-reset">СБРОСИТЬ ПРОГРЕСС (HP & DT)</button>
        </div>
    </div>

    <!-- ================= DT REWARD MODAL ================= -->
    <div id="dt-reward-modal" class="hidden">
        <div class="dt-wings-bg">
            <!-- Векторные крылья (SVG) -->
            <svg class="wings-svg" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="wingGradLeft" x1="100%" y1="50%" x2="0%" y2="50%">
                        <stop offset="0%" stop-color="#ff0033" stop-opacity="1"/>
                        <stop offset="40%" stop-color="#ff0033" stop-opacity="0.8"/>
                        <stop offset="100%" stop-color="#00ffff" stop-opacity="0.6"/>
                    </linearGradient>
                    <linearGradient id="wingGradRight" x1="0%" y1="50%" x2="100%" y2="50%">
                        <stop offset="0%" stop-color="#ff0033" stop-opacity="1"/>
                        <stop offset="40%" stop-color="#ff0033" stop-opacity="0.8"/>
                        <stop offset="100%" stop-color="#00ffff" stop-opacity="0.6"/>
                    </linearGradient>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                <g filter="url(#glow)">
                    <path d="M 500 700 L 450 600 L 300 650 L 400 500 L 150 550 L 320 400 L 80 350 L 250 250 L 50 150 L 200 180 L 120 50 L 300 200 L 350 80 L 450 250 L 500 200 Z" fill="url(#wingGradLeft)" />
                    <path d="M 500 700 L 400 650 L 250 750 L 350 550 L 100 650 L 300 500 L 50 450 L 200 350 L 20 250 L 150 300 L 80 150 L 250 300 L 300 150 L 400 350 L 500 300 Z" fill="url(#wingGradLeft)" opacity="0.6"/>
                </g>
                <g filter="url(#glow)" transform="translate(1000, 0) scale(-1, 1)">
                    <path d="M 500 700 L 450 600 L 300 650 L 400 500 L 150 550 L 320 400 L 80 350 L 250 250 L 50 150 L 200 180 L 120 50 L 300 200 L 350 80 L 450 250 L 500 200 Z" fill="url(#wingGradRight)" />
                    <path d="M 500 700 L 400 650 L 250 750 L 350 550 L 100 650 L 300 500 L 50 450 L 200 350 L 20 250 L 150 300 L 80 150 L 250 300 L 300 150 L 400 350 L 500 300 Z" fill="url(#wingGradRight)" opacity="0.6"/>
                </g>
                <circle cx="500" cy="450" r="40" fill="#ffffff" filter="url(#glow)" opacity="0.9">
                    <animate attributeName="r" values="30; 50; 30" dur="2s" repeatCount="indefinite" />
                    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2s" repeatCount="indefinite" />
                </circle>
            </svg>
        </div>
        <div class="dt-reward-content">
            <h1 class="dt-reward-title">DEVIL TRIGGER IS FULL<br>LET'S ROCK!</h1>
            <div class="dt-reward-box">
                <p style="margin-bottom: 10px; color: #aaa;">Ваша награда на выходные:</p>
                <input type="text" id="dt-reward-input" placeholder="Например: Заказать пиццу, купить игру..." autocomplete="off">
            </div>
            <button id="dt-claim-btn" class="trial-btn" style="width: 100%; margin-top: 15px; text-align: center;">ЗАБРАТЬ НАГРАДУ</button>
            <button id="dt-save-btn" class="trial-btn" style="width: 100%; margin-top: 10px; text-align: center; background: rgba(0, 100, 130, 0.5);">СОХРАНИТЬ НАГРАДУ</button>
        </div>
    </div>

    <!-- ================= DEATH SCREEN ================= -->
    <div id="death-screen" class="hidden">
        <div class="death-header">
            <h1 class="use-orb-title">USE GOLD ORB?</h1>
            <div class="red-line"></div>
        </div>
        <div class="death-ui-container">
            <div class="orb-section">
                <div class="orb-diamond">
                    <div class="orb-inner"></div>
                </div>
                <div class="orb-label">GOLD ORB</div>
            </div>
            <div class="trials-section">
                <button class="trial-btn" onclick="revivePlayer('Лечь спать на 1 час раньше')">ЛЕЧЬ СПАТЬ НА 1 ЧАС РАНЬШЕ</button>
                <button class="trial-btn" onclick="revivePlayer('1 час без телефона')">1 ЧАС БЕЗ ТЕЛЕФОНА</button>
                <button class="trial-btn" onclick="revivePlayer('Почитать 30 минут')">ПОЧИТАТЬ 30 МИНУТ</button>
            </div>
        </div>
    </div>

    <!-- ================= DAY DETAILS MODAL ================= -->
    <div id="day-modal" class="hidden">
        <div class="modal-content">
            <h2 id="modal-date-title" class="section-title">ДЕНЬ</h2>
            <div id="modal-list" class="modal-list"></div>
            <div style="margin-top: 20px; border-top: 1px solid #333; padding-top: 15px;">
                <h3 style="font-size: 0.9rem; margin-bottom: 10px; color: #c0a060;">ЗАМЕТКИ НА ДЕНЬ</h3>
                <textarea id="day-note-input" placeholder="Ваши мысли, планы..." style="width: 100%; height: 80px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #444; padding: 10px; font-family: 'PTSansNarrow', sans-serif; resize: vertical;"></textarea>
                <button id="save-note-btn" class="btn-submit" style="margin-top: 10px; padding: 5px 10px; font-size: 0.7rem;">СОХРАНИТЬ ЗАМЕТКУ</button>
            </div>
            <button id="close-modal" class="btn-submit" style="margin-top:20px;">ЗАКРЫТЬ</button>
        </div>
    </div>

    <!-- ================= TOAST CONTAINER ================= -->
    <div id="toast-container"></div>
    
    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDDdfa7OASH3VtrNhumakD8_ykOS7hjLAo",
        authDomain: "devils-planner.firebaseapp.com",
        projectId: "devils-planner",
        storageBucket: "devils-planner.firebasestorage.app",
        messagingSenderId: "94235054724",
        appId: "1:94235054724:web:e11d543ee312da01c5a8d1"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      window.firebaseAuth = auth;
      window.firebaseDB = db;
      window.firebaseModules = { 
          signInWithEmailAndPassword: await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js").then(m => m.signInWithEmailAndPassword),
          createUserWithEmailAndPassword: await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js").then(m => m.createUserWithEmailAndPassword),
          onAuthStateChanged: await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js").then(m => m.onAuthStateChanged),
          signOut: await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js").then(m => m.signOut),
          doc: await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js").then(m => m.doc),
          getDoc: await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js").then(m => m.getDoc),
          setDoc: await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js").then(m => m.setDoc)
      };
      
      console.log("Firebase успешно подключен!");
      if (window.initAuth) window.initAuth();
    </script>
    <script src="script.js" defer></script>
    
     <!-- Регистрация Service Worker для PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(registration => { console.log('ServiceWorker успешно зарегистрирован!'); })
            .catch(err => { console.log('Ошибка регистрации ServiceWorker:', err); });
        });
      }
    </script>
</body>
</html>
